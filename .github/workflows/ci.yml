name: Olist ETL Pipeline CI

on:
  push:
    branches: [main, master, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          AIRFLOW__API_AUTH__JWT_SECRET: ci-placeholder
          AIRFLOW__API__SECRET_KEY: ci-placeholder
          GCP_PROJECT_ID: ci-project
          BIGQUERY_DATASET: olist_dw
          BIGQUERY_LOCATION: asia-southeast2
        run: docker compose config --quiet

      - name: Build Airflow runtime
        run: |
          docker build -t olist-ci:runtime .
          docker build -f .github/ci/Dockerfile -t olist-ci:checks .

      - name: Lint, check dependencies and run all tests
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace --env PYTHONPATH=/workspace \
            --env AIRFLOW_HOME=/tmp/airflow-ci \
            --env AIRFLOW__CORE__LOAD_EXAMPLES=false \
            --entrypoint /bin/bash olist-ci:checks -euc '
              python -m pip check
              python -m flake8 dags src tests --select=E9,F63,F7,F82
              python src/utils/self_check.py
              airflow db migrate
              python -m pytest -q -p no:cacheprovider
            '
