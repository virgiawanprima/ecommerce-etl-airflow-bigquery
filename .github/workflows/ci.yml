name: Olist ETL Pipeline CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup environment Python 3.12 (sesuai runtime pipeline)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Install semua requirements dan library testing
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest "apache-airflow==3.0.6" -r requirements.txt

    # 4. Linting: Memeriksa kerapian struktur kode (PEP 8)
    - name: Lint with flake8
      run: |
        # Hentikan build jika terdapat syntax error fatal atau undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,logs,data,docs
        # Pelaporan warning style guide (toleransi max-line-length 127)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,logs,data,docs

    # 5. Airflow DAG Integrity Test: Memastikan DAG valid tanpa container penuh
    - name: Run Airflow DAG Integrity Test
      env:
        AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: 'google-cloud-platform://'
        GCP_KEY_PATH: 'config/keys/gcp-sa-key.json'
        GCP_PROJECT_ID: 'dummy-project-id'
        BIGQUERY_DATASET: 'olist_dw'
        BIGQUERY_LOCATION: 'asia-southeast2'
      run: |
        # Buat file kredensial dummy agar scheduler parse tidak gagal saat file dicari
        mkdir -p config/keys
        echo '{"type": "service_account"}' > config/keys/gcp-sa-key.json
        
        # Tambahkan direktori dags dan src ke PYTHONPATH
        export PYTHONPATH=$PYTHONPATH:$(pwd)/dags:$(pwd)/src
        
        # Validasi integritas impor dan task graph pada kedua DAG
        python -c "
        import sys
        sys.path.insert(0, 'dags')
        sys.path.insert(0, 'src')
        import olist_etl_pipeline as p
        assert {t.task_id for t in p.dag.tasks} == {'extract', 'validate_schema', 'transform', 'qdc_validation', 'load'}, 'Kumpulan task DAG utama tidak cocok'
        print('DAG 1 (olist_etl_pipeline) OK:', p.dag.dag_id)
        import olist_etl_baseline_noqdc as b
        print('DAG 2 (olist_etl_baseline_noqdc) OK:', b.dag.dag_id)
        "

    # 6. Unit Testing: Menjalankan test pada utilitas ETL (qdc, pii, io_helpers)
    - name: Run Unit Tests (19 Assertions)
      env:
        PYTHONPATH: src
      run: |
        echo "Menjalankan unit self-check logic (QDC 4-dimensi, threshold fail-fast, PII hash)..."
        if [ -f src/utils/self_check.py ]; then
          python src/utils/self_check.py
        elif [ -f dags/utils/self_check.py ]; then
          python dags/utils/self_check.py
        fi
